name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: trx_energy_phase1_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trx_energy_phase1_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify database migration is current
        shell: bash
        run: |
          set -euo pipefail
          npm run db:generate
          if [ -n "$(git status --porcelain -- drizzle/)" ]; then
            echo "Drizzle migration drift detected:"
            git status --short -- drizzle/
            git diff -- drizzle/
            exit 1
          fi

      - name: Unit and Telegram integration tests
        run: npm test

      - name: PostgreSQL migration and repository integration
        env:
          TEST_DATABASE_URL: postgresql://postgres@localhost:5432/trx_energy_phase1_test
        run: npm run test:postgres
