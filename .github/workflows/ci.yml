name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies and refresh lockfile
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify database migration is current
        shell: bash
        run: |
          set -euo pipefail
          npm run db:generate
          if [ -n "$(git status --porcelain -- drizzle/)" ]; then
            echo "Drizzle migration drift detected:"
            git status --short -- drizzle/
            git diff -- drizzle/
            exit 1
          fi

      - name: Test
        run: npm test

      - name: Export lockfile candidate
        uses: actions/upload-artifact@v4
        with:
          name: phase1-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
