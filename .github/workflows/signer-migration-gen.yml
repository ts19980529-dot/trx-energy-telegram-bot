name: Generate signer migration

on:
  push:
    branches:
      - feat/production-energy-provider
    paths:
      - .github/workflows/signer-migration-gen.yml

permissions:
  contents: write

jobs:
  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/production-energy-provider
          fetch-depth: 20

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Restore immutable migration baseline
        run: |
          git checkout a0ad8e3e196f9f8d7616eb6279e1372e7d65577b -- \
            drizzle/0003_provider_transaction_attempts.sql \
            drizzle/meta/0003_snapshot.json

      - name: Generate signer migration
        run: npm run db:generate

      - name: Commit exact generated migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/signer-migration-gen.yml
          git add drizzle/
          git commit -m "build: generate signer persistence migration"
          git push origin HEAD:feat/production-energy-provider
